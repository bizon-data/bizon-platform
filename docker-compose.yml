services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizon
      POSTGRES_PASSWORD: bizon
      POSTGRES_DB: bizon_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizon -d bizon_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Production services
  # =============================================================================
  api:
    profiles: [prod]
    build:
      context: .
      target: backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bizon:bizon@db:5432/bizon_platform
      STORAGE_LOCAL_PATH: /tmp/bizon-outputs
      CUSTOM_SOURCES_DIR: /custom_sources
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - ./custom_sources:/custom_sources
      - bizon_outputs:/tmp/bizon-outputs
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && uv run python -m bizon_platform"

  worker:
    profiles: [prod]
    build:
      context: .
      target: backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bizon:bizon@db:5432/bizon_platform
      STORAGE_LOCAL_PATH: /tmp/bizon-outputs
      CUSTOM_SOURCES_DIR: /custom_sources
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - ./custom_sources:/custom_sources
      - bizon_outputs:/tmp/bizon-outputs
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "bizon_platform.worker"]

  ui:
    profiles: [prod]
    build:
      context: .
      target: ui
    ports:
      - "3000:8080"
    depends_on:
      - api

  # =============================================================================
  # Development services (hot reload)
  # =============================================================================
  api-dev:
    profiles: [dev]
    build:
      context: .
      target: backend
    ports:
      - "8000:8000"
    volumes:
      - ./bizon_platform:/app/bizon_platform
      - ./custom_sources:/custom_sources
      - bizon_outputs:/tmp/bizon-outputs
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bizon:bizon@db:5432/bizon_platform
      STORAGE_LOCAL_PATH: /tmp/bizon-outputs
      CUSTOM_SOURCES_DIR: /custom_sources
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn bizon_platform.api.app:app --host 0.0.0.0 --port 8000 --reload"

  worker-dev:
    profiles: [dev]
    build:
      context: .
      target: backend
    volumes:
      - ./bizon_platform:/app/bizon_platform
      - ./custom_sources:/custom_sources
      - bizon_outputs:/tmp/bizon-outputs
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://bizon:bizon@db:5432/bizon_platform
      STORAGE_LOCAL_PATH: /tmp/bizon-outputs
      CUSTOM_SOURCES_DIR: /custom_sources
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      api-dev:
        condition: service_started
    command: >
      sh -c "pip install watchfiles && watchfiles 'python -m bizon_platform.worker' /app/bizon_platform"

  ui-dev:
    profiles: [dev]
    image: node:22
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    environment:
      API_URL: http://api-dev:8000
    depends_on:
      - api-dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  bizon_outputs:
  ui_node_modules:
