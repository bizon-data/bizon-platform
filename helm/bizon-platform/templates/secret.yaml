{{- $needsAdmin := and .Values.security.adminPassword (not .Values.security.existingAdminPasswordSecret) }}
{{- $needsToken := and .Values.gitSync.enabled .Values.gitSync.token (not .Values.gitSync.existingTokenSecret) }}
{{- $needsWebhook := and .Values.gitSync.enabled .Values.gitSync.webhookSecret (not .Values.gitSync.existingWebhookSecret) }}
{{- if or (not .Values.postgresql.auth.existingSecret) (not .Values.security.existingEncryptionKeySecret) $needsAdmin $needsToken $needsWebhook }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bizon-platform.fullname" . }}-secrets
  labels:
    {{- include "bizon-platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.security.encryptionKey (not .Values.security.existingEncryptionKeySecret) }}
  encryption-key: {{ .Values.security.encryptionKey | b64enc | quote }}
  {{- else if not .Values.security.existingEncryptionKeySecret }}
  encryption-key: {{ randAlphaNum 44 | b64enc | quote }}
  {{- end }}
  {{- if $needsAdmin }}
  admin-password: {{ .Values.security.adminPassword | b64enc | quote }}
  {{- end }}
  {{- if $needsToken }}
  git-token: {{ .Values.gitSync.token | b64enc | quote }}
  {{- end }}
  {{- if $needsWebhook }}
  git-webhook-secret: {{ .Values.gitSync.webhookSecret | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bizon-platform.fullname" . }}-postgresql
  labels:
    {{- include "bizon-platform.postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgresql.auth.password }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bizon-platform.fullname" . }}-external-db
  labels:
    {{- include "bizon-platform.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
